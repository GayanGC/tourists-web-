services:
  # ── Backend Web Service (Render) ───────────────────────────────────────────
  - type: web
    name: premier-lanka-tours-api
    env: node
    plan: free
    region: oregon
    buildCommand: "cd server && npm install"
    startCommand: "cd server && node index.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: ADMIN_SECRET
        value: plt2025
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: lankatoursp@gmail.com
      - key: SMTP_PASS
        sync: false # Set in Render Dashboard
      - key: NOTIFICATION_EMAIL
        value: lankatoursp@gmail.com
      - key: CORS_ORIGIN
        value: "http://localhost:5173,https://tourist-web.vercel.app"
